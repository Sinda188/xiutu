<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>滤镜工作室</title>
<style>
  :root{
    --primary:#0066cc;
    --primary-focus:#0071e3;
    --primary-on-dark:#2997ff;
    --ink:#1d1d1f;
    --muted:#7a7a7a;
    --muted-80:#333333;
    --hairline:#e0e0e0;
    --divider-soft:#f0f0f0;
    --canvas:#ffffff;
    --parchment:#f5f5f7;
    --black:#000000;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; font-family:"SF Pro Text",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
       background:var(--canvas); color:var(--ink); font-size:17px; line-height:1.5; letter-spacing:0;
       -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;}

  /* 顶部导航（毛玻璃） */
  header{position:sticky; top:0; z-index:10; background:rgba(255,255,255,.72);
         -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px);
         border-bottom:1px solid rgba(0,0,0,.08); padding:12px 22px; display:flex; align-items:center; gap:12px;}
  .brand{font-size:17px; font-weight:600; letter-spacing:0;}
  .brand .sub{font-size:12px; color:var(--muted); font-weight:400; letter-spacing:0; margin-left:8px;}
  .spacer{flex:1;}

  /* 按钮 */
  .btn{border:none; background:transparent; color:var(--primary); border-radius:9999px; padding:8px 15px;
       font-size:14px; font-weight:400; letter-spacing:0; cursor:pointer; display:inline-flex; align-items:center; gap:6px;
       transition:transform .1s;}
  .btn:active{transform:scale(.95);}
  .btn.primary{background:var(--primary); color:#fff; padding:11px 22px;}
  .btn.ghost-dark{color:#fff; border:1px solid rgba(255,255,255,.4);}

  /* 主视觉：全宽黑色区块 */
  .hero{background:var(--black); color:#fff; text-align:center; padding:72px 22px 64px;}
  .hero-title{font-size:40px; font-weight:600; letter-spacing:0; line-height:1.15; margin:0 0 14px;}
  .hero-sub{font-size:21px; font-weight:400; color:#cccccc; letter-spacing:0; margin:0 0 40px;}
  .stage{position:relative; max-width:980px; margin:0 auto; touch-action:pan-y; --cut:50%;}
  #origCanvas{display:block; width:100%; height:auto;}
  #preview{position:absolute; inset:0; width:100%; height:100%; clip-path:inset(0 0 0 var(--cut)); transition:opacity .25s ease;}
  .ba-handle{position:absolute; top:0; bottom:0; left:var(--cut); width:2px; margin-left:-1px; background:rgba(255,255,255,.92); cursor:ew-resize; z-index:2;}
  .ba-knob{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:44px; height:44px; border-radius:50%; background:rgba(0,0,0,.55); color:#fff; display:flex; align-items:center; justify-content:center; font-size:15px; -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);}
  .stage .placeholder{color:#86868b; font-size:17px; padding:80px 20px;}
  .hero-actions{display:flex; gap:10px; justify-content:center; align-items:center; margin-top:32px; flex-wrap:wrap;}
  .hint{font-size:13px; color:#86868b; letter-spacing:0;}

  /* 区块（全宽、颜色交替） */
  .band{padding:72px 22px;}
  .band.light{background:var(--canvas); background-image:radial-gradient(600px 320px at 12% 40%, rgba(0,102,204,.035), transparent 60%), radial-gradient(600px 320px at 88% 60%, rgba(0,102,204,.035), transparent 60%);}
  .band.parchment{background:var(--parchment); background-image:radial-gradient(600px 320px at 10% 35%, rgba(0,102,204,.03), transparent 60%), radial-gradient(600px 320px at 90% 65%, rgba(0,102,204,.03), transparent 60%);}
  .band-inner{max-width:1200px; margin:0 auto;}
  .sec-title{font-size:28px; font-weight:600; letter-spacing:0; margin:0 0 28px; display:flex; align-items:center; justify-content:space-between;}

  /* 滤镜胶囊 */
  .chips{display:flex; gap:14px; overflow-x:auto; padding-bottom:8px; -webkit-overflow-scrolling:touch;}
  .chip{flex:0 0 auto; width:124px; background:var(--canvas); border:1px solid var(--hairline); border-radius:18px;
        padding:10px; cursor:pointer; transition:border-color .15s;}
  .chip.active{border-color:var(--primary); box-shadow:0 0 0 1px var(--primary);}
  .chip canvas{width:100%; height:76px; border-radius:10px; display:block; background:var(--divider-soft);}
  .chip .name{font-size:13px; font-weight:600; margin-top:9px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:0;}
  .chip.active .name{color:var(--primary);}
  .chip .tag{font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:0;}

  /* 滑杆（无卡片） */
  .slider-row{display:grid; grid-template-columns:88px 1fr 46px; gap:14px; align-items:center; margin-bottom:22px;}
  .slider-row label{font-size:14px; color:var(--ink); letter-spacing:0;}
  .slider-row input[type=range]{width:100%; accent-color:var(--primary);}
  .slider-row .val{font-size:12px; color:var(--muted); text-align:right; font-variant-numeric:tabular-nums;}
  .slider-actions{display:flex; gap:8px; margin-top:10px;}

  footer{background:var(--parchment); border-top:1px solid var(--divider-soft); padding:36px 22px; text-align:center;
         color:var(--muted); font-size:12px; letter-spacing:0;}

  /* 对比九宫格 */
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:16px;}
  .grid .cell{background:var(--canvas); border:1px solid var(--hairline); border-radius:18px; padding:10px; text-align:center; cursor:pointer;}
  .grid .cell:hover{border-color:var(--primary);}
  .grid .cell canvas{width:100%; height:auto; border-radius:10px; display:block; background:var(--divider-soft);}
  .grid .cell .nm{font-size:13px; margin-top:8px; font-weight:600; letter-spacing:0;}
  .grid .cell .note{font-size:11px; color:var(--muted);}

  dialog{border:1px solid var(--hairline); border-radius:18px; padding:24px; max-width:92vw; max-height:88vh; width:760px; overflow:auto;}
  dialog::backdrop{background:rgba(0,0,0,.45);}
  dialog h2{margin:0 0 6px; font-size:21px; font-weight:600; letter-spacing:0;}
  dialog p{font-size:14px; color:var(--muted); margin:0 0 16px;}

  .toast{position:fixed; left:50%; bottom:28px; transform:translateX(-50%); background:var(--ink); color:#fff;
         padding:10px 18px; border-radius:9999px; font-size:14px; opacity:0; pointer-events:none; transition:opacity .2s; z-index:99;}
  .toast.show{opacity:1;}
  #file{display:none;}
  #exporting{position:fixed; inset:0; background:rgba(255,255,255,.7); display:none; align-items:center; justify-content:center; z-index:50; flex-direction:column; gap:10px;}
  #exporting .spin{width:34px; height:34px; border:3px solid var(--divider-soft); border-top-color:var(--primary); border-radius:50%; animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* 动态效果 */
  .reveal{opacity:0; transform:translateY(24px); transition:opacity .7s ease, transform .7s ease;}
  .reveal.in{opacity:1; transform:none;}
  @keyframes rise{from{opacity:0; transform:translateY(20px);} to{opacity:1; transform:none;}}
  .hero-title{animation:rise .8s ease both;}
  .hero-sub{animation:rise .8s .1s ease both;}
  .stage{animation:rise .8s .2s ease both;}
  .hero-actions{animation:rise .8s .3s ease both;}
  .hero{position:relative; overflow:hidden;}
  .hero::before{content:""; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(600px 420px at 50% 10%, rgba(41,151,255,.16), transparent 70%);
    animation:glow 8s ease-in-out infinite alternate;}
  @keyframes glow{from{opacity:.55;} to{opacity:1;}}
  .chip{transition:transform .2s ease, border-color .2s ease, box-shadow .2s ease;}
  .chip:hover{transform:translateY(-3px);}
  .chip:active{transform:scale(.96);}
  .btn:hover{opacity:.85;}
  input[type=range]{-webkit-appearance:none; appearance:none; height:4px; background:#d2d2d7; border-radius:9999px; outline:none;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; appearance:none; width:22px; height:22px; border-radius:50%; background:#fff; border:1px solid #d2d2d7; box-shadow:0 1px 4px rgba(0,0,0,.15); cursor:pointer; transition:transform .15s;}
  input[type=range]::-webkit-slider-thumb:active{transform:scale(1.15);}
  input[type=range]::-moz-range-thumb{width:22px; height:22px; border-radius:50%; background:#fff; border:1px solid #d2d2d7; cursor:pointer;}

  @media (max-width:640px){
    .hero{padding:48px 16px 40px;}
    .hero-title{font-size:28px;}
    .hero-sub{font-size:17px;}
    .band{padding:48px 16px;}
    .sec-title{font-size:22px;}
  }
</style>
</head>
<body>
<header>
  <div class="brand">滤镜工作室<span class="sub">上传照片 · 选滤镜 · 导出</span></div>
  <div class="spacer"></div>
  <button class="btn" id="btnCompare">对比</button>
  <button class="btn primary" id="btnUpload">上传照片</button>
</header>

<section class="hero">
  <h2 class="hero-title">让照片更有质感</h2>
  <p class="hero-sub">选一个滤镜，或手动微调，导出高清照片。</p>
  <div class="stage" id="stage">
    <div class="placeholder" id="placeholder">上传一张照片开始</div>
    <canvas id="origCanvas"></canvas>
    <canvas id="preview"></canvas>
    <div class="ba-handle" id="baHandle"><div class="ba-knob">⇔</div></div>
  </div>
  <div class="hero-actions">
    <button class="btn ghost-dark" id="btnReset">重置参数</button>
    <button class="btn ghost-dark" id="btnSave">💾 存为我的滤镜</button>
    <span class="hint" id="curName"></span>
  </div>
  <p class="hint" style="margin-top:18px;">拖动照片中间的线，左右对比原图与滤镜效果</p>
</section>

<section class="band light">
  <div class="band-inner">
    <div class="sec-title"><span>滤镜</span><span class="hint" id="filterCount" style="color:#86868b;font-size:14px;"></span></div>
    <div class="chips" id="chips"></div>
  </div>
</section>

<section class="band parchment">
  <div class="band-inner">
    <div class="sec-title">手动微调</div>
    <div id="sliders"></div>
  </div>
</section>

<footer>照片全程在你的浏览器本地处理，不会上传到任何服务器。</footer>

<dialog id="cmpDlg">
  <h2>滤镜对比</h2>
  <p>同一张照片套不同滤镜的效果，点任意一张即可选中该滤镜。</p>
  <div class="grid" id="cmpGrid"></div>
  <div style="text-align:right;margin-top:14px;"><button class="btn" id="btnCloseCmp">关闭</button></div>
</dialog>

<div class="toast" id="toast"></div>
<input type="file" id="file" accept="image/*">
<div id="exporting"><div class="spin"></div><div style="font-size:14px;color:#374151;">正在导出高清图…</div></div>

<script src="filters.js"></script>
<script>
(function(){
  "use strict";

  // ---------- 参数定义 ----------
  var FILTER_PARAMS = [
    {key:"temperature", label:"色温",  min:-100, max:100, def:0, step:1, unit:""},
    {key:"tint",        label:"色调",  min:-100, max:100, def:0, step:1, unit:""},
    {key:"exposure",    label:"曝光",  min:-2,   max:2,   def:0, step:0.05, unit:"EV"},
    {key:"contrast",    label:"对比度",min:-100, max:100, def:0, step:1, unit:""},
    {key:"highlights",  label:"高光",  min:-100, max:100, def:0, step:1, unit:""},
    {key:"shadows",     label:"阴影",  min:-100, max:100, def:0, step:1, unit:""},
    {key:"saturation",  label:"饱和度",min:-100, max:100, def:0, step:1, unit:""},
    {key:"vibrance",    label:"自然饱和",min:-100,max:100, def:0, step:1, unit:""},
    {key:"fade",        label:"褪色·胶片",min:0, max:100, def:0, step:1, unit:""},
    {key:"grain",       label:"颗粒",  min:0,   max:100, def:0, step:1, unit:""},
    {key:"vignette",    label:"暗角",  min:0,   max:100, def:0, step:1, unit:""},
    {key:"cyanBoost",   label:"青绿增强",min:0, max:100, def:0, step:1, unit:""}
  ];

  function defaultParams(){
    var o = {};
    FILTER_PARAMS.forEach(function(p){ o[p.key] = p.def; });
    return o;
  }
  function cloneParams(p){
    var o = {};
    for (var k in p) o[k] = p[k];
    return o;
  }

  function clamp(v){ return v<0?0:(v>255?255:v); }
  function toast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove("show"); }, 1800);
  }
  function fmtVal(p){
    if (p.unit === "EV") return p.val.toFixed(2);
    return Math.round(p.val);
  }

  function loadFilters(){
    var list = (window.FILTERS || []).slice();
    try {
      var custom = JSON.parse(localStorage.getItem("xiutu.custom") || "[]");
      custom.forEach(function(f){ f.custom = true; list.push(f); });
    } catch(e){}
    return list;
  }
  function allFilters(){ return loadFilters(); }

  function makeSample(w, h){
    var c = document.createElement("canvas"); c.width=w; c.height=h;
    var g = c.getContext("2d");
    var sky = g.createLinearGradient(0,0,0,h*0.62);
    sky.addColorStop(0,"#8ec8e8"); sky.addColorStop(1,"#f4e7c3");
    g.fillStyle=sky; g.fillRect(0,0,w,h*0.62);
    g.fillStyle="#6fa08a"; g.beginPath();
    g.moveTo(0,h*0.5); g.lineTo(w*0.3,h*0.32); g.lineTo(w*0.55,h*0.48); g.lineTo(w,h*0.3); g.lineTo(w,h*0.62); g.lineTo(0,h*0.62); g.closePath(); g.fill();
    var gr = g.createLinearGradient(0,h*0.6,0,h);
    gr.addColorStop(0,"#5d9b62"); gr.addColorStop(1,"#2f6b3a");
    g.fillStyle=gr; g.fillRect(0,h*0.6,w,h*0.4);
    g.fillStyle="#3aa6b8"; g.beginPath();
    g.ellipse(w*0.5, h*0.78, w*0.42, h*0.14, 0, 0, Math.PI*2); g.fill();
    return c;
  }

  function makeVignette(w, h, amount){
    var arr = new Float32Array(w*h);
    if (!amount) { arr.fill(1); return arr; }
    var cx=w/2, cy=h/2;
    for (var y=0;y<h;y++){
      for (var x=0;x<w;x++){
        var dx=(x-cx)/cx, dy=(y-cy)/cy;
        var d=Math.min(1, Math.sqrt(dx*dx+dy*dy)/Math.SQRT2);
        arr[y*w+x] = 1 - amount*0.85*d*d;
      }
    }
    return arr;
  }

  function processPixels(data, w, h, p){
    var t = (p.temperature||0)/100;
    var m = (p.tint||0)/100;
    var exp = Math.pow(2, p.exposure||0);
    var cf = (100 + (p.contrast||0))/100;
    var hl = (p.highlights||0)/100;
    var sh = (p.shadows||0)/100;
    var sat = 1 + (p.saturation||0)/100;
    var vib = (p.vibrance||0)/100;
    var fd = (p.fade||0)/100;
    var gr = (p.grain||0)/100 * 24;
    var cb = (p.cyanBoost||0)/100;
    var vig = makeVignette(w, h, (p.vignette||0)/100);

    for (var i=0;i<data.length;i+=4){
      var r=data[i], g=data[i+1], b=data[i+2];

      r*=exp; g*=exp; b*=exp;

      r *= 1 + t*0.12;
      b *= 1 - t*0.12;
      g *= 1 - m*0.12;

      r=(r-128)*cf+128; g=(g-128)*cf+128; b=(b-128)*cf+128;

      var L = 0.299*r + 0.587*g + 0.114*b;
      var nL = L/255;
      if (hl){ var a=hl*60*nL; r+=a; g+=a; b+=a; }
      if (sh){ var a2=sh*60*(1-nL); r+=a2; g+=a2; b+=a2; }

      if (sat !== 1){ r=L+(r-L)*sat; g=L+(g-L)*sat; b=L+(b-L)*sat; }

      if (vib){
        var mx=Math.max(r,g,b), mn=Math.min(r,g,b);
        var s = mx===0 ? 0 : (mx-mn)/mx;
        var f = 1 + vib*(1-s);
        L = 0.299*r + 0.587*g + 0.114*b;
        r=L+(r-L)*f; g=L+(g-L)*f; b=L+(b-L)*f;
      }

      if (cb){
        var mx2=Math.max(r,g,b), mn2=Math.min(r,g,b);
        if (mx2>mn2){
          var d=mx2-mn2, hue;
          if (mx2===r) hue=((g-b)/d)%6;
          else if (mx2===g) hue=(b-r)/d+2;
          else hue=(r-g)/d+4;
          hue*=60; if(hue<0)hue+=360;
          if (hue>=158 && hue<=222){
            var L2 = 0.299*r + 0.587*g + 0.114*b;
            var f2 = 1 + cb*0.8;
            r=L2+(r-L2)*f2; g=L2+(g-L2)*f2; b=L2+(b-L2)*f2;
          }
        }
      }

      if (fd){ r=r*(1-fd)+128*fd; g=g*(1-fd)+128*fd; b=b*(1-fd)+128*fd; }

      var v = vig[i>>2];
      if (v<1){ r*=v; g*=v; b*=v; }

      if (gr){ var n=(Math.random()*2-1)*gr; r+=n; g+=n; b+=n; }

      data[i]=clamp(r); data[i+1]=clamp(g); data[i+2]=clamp(b);
    }
  }

  function renderToCanvas(img, params, maxW){
    var w = img.naturalWidth || img.width;
    var h = img.naturalHeight || img.height;
    var scale = maxW ? Math.min(1, maxW/w) : 1;
    var ow = Math.max(1, Math.round(w*scale));
    var oh = Math.max(1, Math.round(h*scale));
    var c = document.createElement("canvas"); c.width=ow; c.height=oh;
    var g = c.getContext("2d");
    g.drawImage(img, 0, 0, ow, oh);
    var id = g.getImageData(0, 0, ow, oh);
    processPixels(id.data, ow, oh, params);
    g.putImageData(id, 0, 0);
    return c;
  }

  var curImage = null;
  var curParams = defaultParams();
  var curFilterId = null;
  var previewMax = 1000;

  var preview = document.getElementById("preview");
  var origCanvas = document.getElementById("origCanvas");
  var stage = document.getElementById("stage");
  var baHandle = document.getElementById("baHandle");
  var placeholder = document.getElementById("placeholder");

  function ensureImage(){
    if (curImage) return curImage;
    var c = makeSample(800, 500);
    curImage = c;
    placeholder.style.display = "none";
    return curImage;
  }

  function draw(){
    if (!curImage){
      preview.style.display = "none"; origCanvas.style.display = "none"; baHandle.style.display = "none";
      placeholder.style.display = "block"; return;
    }
    placeholder.style.display = "none";
    preview.style.display = "block"; origCanvas.style.display = "block"; baHandle.style.display = "block";
    var c = renderToCanvas(curImage, curParams, previewMax);
    preview.width = c.width; preview.height = c.height;
    origCanvas.width = c.width; origCanvas.height = c.height;
    origCanvas.getContext("2d").drawImage(curImage, 0, 0, c.width, c.height);
    preview.getContext("2d").drawImage(c, 0, 0);
    highlightActive();
  }

  function pulsePreview(){
    preview.style.opacity = 0.5;
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ preview.style.opacity = 1; }); });
  }

  var dragging = false;
  function updateCut(e){
    if (!curImage) return;
    var r = stage.getBoundingClientRect();
    var x = (e.clientX - r.left) / r.width * 100;
    x = Math.max(0, Math.min(100, x));
    stage.style.setProperty("--cut", x + "%");
  }
  stage.addEventListener("pointerdown", function(e){ dragging = true; updateCut(e); try{ stage.setPointerCapture(e.pointerId); }catch(_){} });
  stage.addEventListener("pointermove", function(e){ if (dragging) updateCut(e); });
  stage.addEventListener("pointerup", function(){ dragging = false; });
  stage.addEventListener("pointercancel", function(){ dragging = false; });

  var drawTimer = null;
  function scheduleDraw(ms){
    clearTimeout(drawTimer);
    drawTimer = setTimeout(draw, ms || 80);
  }

  var slidersBox = document.getElementById("sliders");
  var sliderInputs = {};
  FILTER_PARAMS.forEach(function(p){
    var row = document.createElement("div");
    row.className = "slider-row";
    var lab = document.createElement("label"); lab.textContent = p.label;
    var inp = document.createElement("input"); inp.type = "range";
    inp.min = p.min; inp.max = p.max; inp.step = p.step; inp.value = p.def;
    var val = document.createElement("div"); val.className = "val";
    row.appendChild(lab); row.appendChild(inp); row.appendChild(val);
    slidersBox.appendChild(row);
    sliderInputs[p.key] = inp;
    inp.addEventListener("input", function(){
      curParams[p.key] = parseFloat(inp.value);
      val.textContent = fmtVal({val: curParams[p.key], unit: p.unit});
      curFilterId = null;
      scheduleDraw(40);
    });
  });

  var btnReset = document.createElement("button");
  btnReset.className = "btn"; btnReset.textContent = "重置全部参数";
  var btnResetRow = document.createElement("div");
  btnResetRow.className = "slider-actions";
  btnResetRow.appendChild(btnReset);
  slidersBox.appendChild(btnResetRow);
  btnReset.addEventListener("click", function(){
    setParams(defaultParams(), null);
    toast("已重置");
  });

  function setParams(params, filterId){
    curParams = cloneParams(params);
    curFilterId = filterId;
    FILTER_PARAMS.forEach(function(p){
      var inp = sliderInputs[p.key];
      var v = (p.key in curParams) ? curParams[p.key] : p.def;
      inp.value = v;
      inp.nextSibling.textContent = fmtVal({val: v, unit: p.unit});
    });
    scheduleDraw(20);
    pulsePreview();
  }

  function syncSliders(){
    FILTER_PARAMS.forEach(function(p){
      var inp = sliderInputs[p.key];
      var v = (p.key in curParams) ? curParams[p.key] : p.def;
      inp.value = v;
      inp.nextSibling.textContent = fmtVal({val: v, unit: p.unit});
    });
  }

  var chips = document.getElementById("chips");
  function buildChips(){
    var list = allFilters();
    chips.innerHTML = "";
    document.getElementById("filterCount").textContent = list.length + " 个";
    list.forEach(function(f){
      var chip = document.createElement("div");
      chip.className = "chip" + (f.id === curFilterId ? " active" : "");
      var cv = renderToCanvas(makeSample(120, 80), f.params, 120);
      var name = document.createElement("div"); name.className = "name"; name.textContent = f.name;
      var tag = document.createElement("div"); tag.className = "tag";
      tag.textContent = (f.tags||[]).join(" · ") + (f.custom ? " (我的)" : "");
      chip.appendChild(cv); chip.appendChild(name); chip.appendChild(tag);
      chip.addEventListener("click", function(){
        setParams(f.params, f.id);
        document.getElementById("curName").textContent = "当前：" + f.name;
        remember(f.id);
      });
      chips.appendChild(chip);
    });
    highlightActive();
  }
  function highlightActive(){
    Array.prototype.forEach.call(chips.children, function(c, i){
      var f = allFilters()[i];
      if (f) c.classList.toggle("active", f.id === curFilterId);
    });
  }

  function remember(id){
    try {
      var recent = JSON.parse(localStorage.getItem("xiutu.recent") || "[]");
      recent = recent.filter(function(x){ return x !== id; });
      recent.unshift(id);
      localStorage.setItem("xiutu.recent", JSON.stringify(recent.slice(0, 20)));
    } catch(e){}
  }

  var fileInput = document.getElementById("file");
  document.getElementById("btnUpload").addEventListener("click", function(){ fileInput.click(); });
  fileInput.addEventListener("change", function(){
    if (!fileInput.files || !fileInput.files[0]) return;
    var f = fileInput.files[0];
    var url = URL.createObjectURL(f);
    var img = new Image();
    img.onload = function(){
      curImage = img;
      URL.revokeObjectURL(url);
      draw();
      toast("已加载：" + f.name);
    };
    img.src = url;
  });

  document.getElementById("btnSave").addEventListener("click", function(){
    var name = prompt("给这个滤镜起个名字：");
    if (!name) return;
    var f = { id: "custom-" + Date.now(), name: name, desc: "自定义", tags: ["我的"], params: cloneParams(curParams), custom: true };
    var custom = [];
    try { custom = JSON.parse(localStorage.getItem("xiutu.custom") || "[]"); } catch(e){}
    custom.push(f);
    localStorage.setItem("xiutu.custom", JSON.stringify(custom));
    buildChips();
    toast("已保存：" + name);
  });

  var cmpDlg = document.getElementById("cmpDlg");
  document.getElementById("btnCompare").addEventListener("click", function(){
    var grid = document.getElementById("cmpGrid");
    grid.innerHTML = "";
    var src = ensureImage();
    var list = allFilters();

    function addCell(title, note, params, id){
      var cell = document.createElement("div"); cell.className = "cell";
      var cv = renderToCanvas(src, params, 360);
      var nm = document.createElement("div"); nm.className = "nm"; nm.textContent = title;
      var no = document.createElement("div"); no.className = "note"; no.textContent = note || "";
      cell.appendChild(cv); cell.appendChild(nm); cell.appendChild(no);
      cell.addEventListener("click", function(){
        setParams(params, id);
        cmpDlg.close();
        if (title !== "原图") { document.getElementById("curName").textContent = "当前：" + title; remember(id); }
        toast("已应用：" + title);
      });
      grid.appendChild(cell);
    }
    addCell("原图", "未处理", defaultParams(), null);
    list.forEach(function(f){ addCell(f.name, (f.tags||[]).join(" · "), f.params, f.id); });
    cmpDlg.showModal();
  });
  document.getElementById("btnCloseCmp").addEventListener("click", function(){ cmpDlg.close(); });

  function exportImage(){
    if (!curImage) return;
    var exporting = document.getElementById("exporting");
    exporting.style.display = "flex";
    setTimeout(function(){
      try {
        var w = curImage.naturalWidth || curImage.width;
        var h = curImage.naturalHeight || curImage.height;
        var scale = 1;
        if (w > 5000) scale = 5000/w;
        var c = renderToCanvas(curImage, curParams, Math.round(w*scale));
        var name = (curFilterId ? "修图_" + curFilterId : "修图") + ".jpg";
        c.toBlob(function(blob){
          var a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = name;
          a.click();
          URL.revokeObjectURL(a.href);
          exporting.style.display = "none";
          toast("已导出 " + name);
        }, "image/jpeg", 0.92);
      } catch(e){
        exporting.style.display = "none";
        toast("导出失败：" + e.message);
      }
    }, 50);
  }

  (function(){
    var b = document.createElement("button");
    b.className = "btn primary"; b.textContent = "导出";
    b.id = "btnExport";
    document.querySelector("header").insertBefore(b, document.getElementById("btnUpload"));
  })();
  document.getElementById("btnExport").addEventListener("click", exportImage);

  buildChips();
  ensureImage();
  draw();

  if ("IntersectionObserver" in window){
    var io = new IntersectionObserver(function(es){
      es.forEach(function(en){ if (en.isIntersecting){ en.target.classList.add("in"); io.unobserve(en.target); } });
    }, {threshold:.12});
    document.querySelectorAll(".band").forEach(function(b){ b.classList.add("reveal"); io.observe(b); });
  }

  window.xiutu = { processPixels: processPixels, makeSample: makeSample, renderToCanvas: renderToCanvas, FILTER_PARAMS: FILTER_PARAMS };
})();
</script>
</body>
</html>
